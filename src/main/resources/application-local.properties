# Local profile overrides. Dummy values only - never put a real key here.
# Run with: --spring.profiles.active=local
# Real key is injected via the OPENAI_API_KEY environment variable.

# OpenAI
openai.api-key=${OPENAI_API_KEY:sk-dummy-local-key}
openai.model=gpt-4.1-nano
openai.embedding-model=text-embedding-3-small
openai.base-url=https://api.openai.com/v1
openai.timeout.connect=3s
openai.timeout.read=15s
