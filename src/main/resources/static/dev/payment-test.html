<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>[DEV] 토스페이먼츠 결제 테스트</title>
    <!-- 토스페이먼츠 결제창 SDK (v1, "기존 결제창") -->
    <script src="https://js.tosspayments.com/v1/payment"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; color: #1b1b1f; }
        h1 { font-size: 20px; } h2 { font-size: 16px; margin-top: 28px; }
        label { display: block; margin: 12px 0 4px; font-size: 13px; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        button { margin-top: 20px; width: 100%; padding: 14px; border: 0; border-radius: 8px; background: #3182f6; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
        button:disabled { background: #b0c4de; cursor: not-allowed; }
        .hint { font-size: 12px; color: #888; margin-top: 4px; }
        .result { margin-top: 24px; padding: 16px; border-radius: 8px; white-space: pre-wrap; font-size: 13px; }
        .ok { background: #e8f5e9; color: #1b5e20; } .err { background: #ffebee; color: #b71c1c; }
        .card-box { background: #f4f6f8; border-radius: 8px; padding: 12px 16px; font-size: 13px; line-height: 1.7; }
    </style>
</head>
<body>
<h1>🧪 토스페이먼츠 결제 테스트 (DEV 전용)</h1>

<div id="form-section">
    <label>API Base URL</label>
    <input id="baseUrl" value="http://localhost:8080"/>

    <label>테스트 userId (dev 토큰 발급용)</label>
    <input id="userId" type="number" value="1"/>
    <div class="hint">GET /dev/token/{userId} 로 accessToken을 발급받습니다. (dev 프로파일 필요)</div>

    <label>토스 클라이언트 키 (test_ck_...)</label>
    <input id="clientKey" placeholder="test_ck_..."/>
    <div class="hint">⚠️ 백엔드 .env의 TOSS_SECRET_KEY(test_sk_)와 <b>같은 상점의 키</b>여야 confirm이 성공합니다.</div>

    <label>상품</label>
    <select id="productType">
        <option value="PREMIUM_1MONTH">프리미엄 1개월 (4,900원)</option>
        <option value="PREMIUM_1YEAR">프리미엄 1년 (49,000원)</option>
    </select>

    <button id="payBtn" onclick="startPayment()">결제 시작</button>

    <h2>테스트 카드</h2>
    <div class="card-box">
        카드번호: <b>4330-1234-1234-1234</b><br/>
        유효기간: 미래의 아무 날짜 (예: 12/30)<br/>
        생년월일/사업자번호: 아무 값<br/>
        비밀번호 앞 2자리: 아무 값<br/>
        <span class="hint">테스트 키는 실제 카드사로 승인 요청이 가지 않아 돈이 빠져나가지 않습니다.</span>
    </div>
</div>

<div id="result"></div>

<script>
    const $ = (id) => document.getElementById(id);
    const showResult = (ok, text) => {
        const el = $('result');
        el.className = 'result ' + (ok ? 'ok' : 'err');
        el.textContent = text;
    };

    // localStorage 키 — 결제창 리다이렉트 후(새 페이지 로드)에도 값을 유지하기 위함
    const LS = { base: 'pt_base', token: 'pt_token' };

    // 1) dev 토큰 발급 → accessToken 반환
    async function fetchDevToken(base, userId) {
        const res = await fetch(`${base}/dev/token/${userId}`);
        if (!res.ok) throw new Error(`토큰 발급 실패 (${res.status}). dev 프로파일로 실행했는지 확인하세요.`);
        const data = await res.json();
        return data.accessToken;
    }

    // 2) 주문 생성 → { orderId, amount, orderName }
    async function createOrder(base, token, productType) {
        const res = await fetch(`${base}/api/v1/payments/orders`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ productType })
        });
        const json = await res.json();
        if (!res.ok || !json.success) throw new Error(`주문 생성 실패: ${JSON.stringify(json)}`);
        return json.data;
    }

    // 3) 결제 시작: 토큰 발급 → 주문 생성 → 토스 결제창 호출
    async function startPayment() {
        const base = $('baseUrl').value.trim().replace(/\/$/, '');
        const userId = $('userId').value.trim();
        const clientKey = $('clientKey').value.trim();
        const productType = $('productType').value;

        if (!clientKey) { showResult(false, '토스 클라이언트 키(test_ck_)를 입력하세요.'); return; }

        $('payBtn').disabled = true;
        try {
            const token = await fetchDevToken(base, userId);
            const order = await createOrder(base, token, productType);

            // 리다이렉트 후 confirm 단계에서 쓰도록 저장
            localStorage.setItem(LS.base, base);
            localStorage.setItem(LS.token, token);

            const redirectBase = window.location.origin + window.location.pathname;
            const tossPayments = TossPayments(clientKey);
            tossPayments.requestPayment('카드', {
                amount: order.amount,
                orderId: order.orderId,
                orderName: order.orderName,
                customerName: '테스트유저',
                successUrl: redirectBase + '?step=confirm',
                failUrl: redirectBase + '?step=fail'
            });
            // 결제창으로 이동 — 이후 successUrl/failUrl 로 리다이렉트됨
        } catch (e) {
            $('payBtn').disabled = false;
            showResult(false, '❌ ' + e.message);
        }
    }

    // 4) 승인(confirm): 결제창 성공 리다이렉트 후 실행
    async function confirmPayment() {
        const params = new URLSearchParams(window.location.search);
        const paymentKey = params.get('paymentKey');
        const orderId = params.get('orderId');
        const amount = Number(params.get('amount'));

        const base = localStorage.getItem(LS.base);
        const token = localStorage.getItem(LS.token);

        $('form-section').style.display = 'none';
        showResult(true, '결제 승인 요청 중...');

        try {
            const res = await fetch(`${base}/api/v1/payments/confirm`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ paymentKey, orderId, amount })
            });
            const json = await res.json();
            if (!res.ok || !json.success) throw new Error(JSON.stringify(json, null, 2));
            showResult(true, '✅ 결제 완료!\n\n' + JSON.stringify(json.data, null, 2));
        } catch (e) {
            showResult(false, '❌ 승인 실패\n\n' + e.message);
        }
    }

    // 5) 페이지 로드 시 단계 분기
    (function onLoad() {
        const params = new URLSearchParams(window.location.search);
        const step = params.get('step');
        if (step === 'confirm') {
            confirmPayment();
        } else if (step === 'fail') {
            $('form-section').style.display = 'none';
            showResult(false, '❌ 결제 실패/취소\ncode: ' + params.get('code') + '\nmessage: ' + params.get('message'));
        }
    })();
</script>
</body>
</html>
