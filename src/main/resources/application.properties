spring.application.name=lightrip

# Kakao OAuth2
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_REST_API_KEY}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.scope=profile_nickname, account_email

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=10800000
jwt.refresh-token-expiration=1209600000

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Sentry (??? ?? ??)
sentry.dsn=${SENTRY_DSN:}
sentry.send-default-pii=true

# ??
spring.main.allow-circular-references=true
server.forward-headers-strategy=native
app.deep-link.scheme=${DEEP_LINK_SCHEME:com.anonymous.lightrip}

# token
logging.level.com.kauniv.lightrip=${LOGGING_LEVEL:INFO}

# API ?? (Swagger)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# AWS S3
cloud.aws.s3.bucket=${AWS_S3_BUCKET}
cloud.aws.region.static=${AWS_REGION}
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
cloud.aws.stack.auto=false
cloud.cloudfront.domain=${CLOUDFRONT_DOMAIN}

# Monitoring (Prometheus + Grafana)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# OpenAI
openai.api-key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-4.1-nano}
# embedding-model: must output 1536 dims to match passport.embedding vector(1536)
openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.timeout.connect=3s
openai.timeout.read=15s

# Stamp
app.stamp.base-url=https://cdn.lightrip.cloud/stamps

# Toss Payments
toss.secret-key=${TOSS_SECRET_KEY}
toss.base-url=https://api.tosspayments.com
